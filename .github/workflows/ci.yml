name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.21,<2"
          python -m pip install torch==1.13.1+cpu torchvision==0.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install Pillow dominate
      - name: Check Python syntax
        run: python -m compileall -q data models options scripts train.py test.py util
      - name: Run SHASP integration smoke test
        run: python scripts/smoke_test_shasp.py
